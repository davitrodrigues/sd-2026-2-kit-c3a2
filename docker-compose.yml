# sobe a plataforma inteira com um comando:  docker compose up --build
#
# toda configuracao vem do .env (copie o .env.example). os valores depois de
# ":-" sao so o padrao de desenvolvimento, para o clone rodar mesmo sem .env.
#
# fluxo: cliente -> gateway (8000, unica porta publica) -> inferencia -> redis
#        (fila) -> worker(s) -> redis (resultado) -> inferencia -> gateway

# configuracao comum aos servicos que falam com o redis
# um servico parado some do dns interno do docker, e a consulta pelo nome dele
# demoraria ~4s para falhar, mais que os tempos-limite; o resolvedor desiste
# em 1s para a falha aparecer rapido e a retentativa/disjuntor agirem.
x-dns: &dns-rapido
  dns_opt: ["timeout:1", "attempts:1"]

x-redis: &redis-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1}
  REDIS_TENTATIVAS: ${REDIS_TENTATIVAS:-1}

services:
  redis:
    image: redis:7-alpine
    # aof: a fila e os resultados sobrevivem a um restart do redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-dados:/data
    # so no localhost da maquina, para depurar; fora dela o redis nao aparece
    ports: ["127.0.0.1:${REDIS_PORTA:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  inferencia:
    build: ./inferencia
    <<: *dns-rapido
    # sem "ports": so e acessivel pela rede interna, sempre via gateway
    environment:
      <<: *redis-env
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: ./worker
    <<: *dns-rapido
    environment:
      <<: *redis-env
      WORKER_ESPERA_REDIS_BASE: ${WORKER_ESPERA_REDIS_BASE:-1}
      WORKER_ESPERA_REDIS_MAXIMA: ${WORKER_ESPERA_REDIS_MAXIMA:-30}
    # varios workers dividem a mesma fila (sem porta nem nome fixo, escala)
    deploy:
      replicas: ${WORKERS:-2}
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  gateway:
    build: ./gateway
    <<: *dns-rapido
    ports: ["${GATEWAY_PORTA:-8000}:8000"]
    environment:
      <<: *redis-env
      URL_INFERENCIA: ${URL_INFERENCIA:-http://inferencia:8001}
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo}
      JWT_EXPIRA_MINUTOS: ${JWT_EXPIRA_MINUTOS:-30}
      GATEWAY_USUARIO: ${GATEWAY_USUARIO:-admin}
      GATEWAY_SENHA: ${GATEWAY_SENHA:-troque-esta-senha}
      LIMITE_POR_MINUTO: ${LIMITE_POR_MINUTO:-10}
      LIMITE_LOGIN_POR_MINUTO: ${LIMITE_LOGIN_POR_MINUTO:-5}
      INFERENCIA_TIMEOUT_CONEXAO: ${INFERENCIA_TIMEOUT_CONEXAO:-1}
      INFERENCIA_TIMEOUT_LEITURA: ${INFERENCIA_TIMEOUT_LEITURA:-3}
      INFERENCIA_TENTATIVAS: ${INFERENCIA_TENTATIVAS:-3}
      INFERENCIA_ESPERA_BASE: ${INFERENCIA_ESPERA_BASE:-0.2}
      DISJUNTOR_LIMITE_FALHAS: ${DISJUNTOR_LIMITE_FALHAS:-3}
      DISJUNTOR_ESPERA_SEGUNDOS: ${DISJUNTOR_ESPERA_SEGUNDOS:-15}
    depends_on:
      redis: {condition: service_healthy}
      # espera o healthcheck do Dockerfile da inferencia (modelo carregado)
      inferencia: {condition: service_healthy}
    restart: unless-stopped

volumes:
  redis-dados:

# Observe: os servicos se referenciam pelo NOME (inferencia, redis),
# nunca por IP fixo. Isso e descoberta de servicos. (Aula 14)
