# TROQUE estes valores antes de aplicar fora da sua maquina. sao os mesmos
# padroes de desenvolvimento do .env.example, so para o cluster local subir.
# em producao, crie o secret direto no cluster em vez de versionar:
#   kubectl -n plataforma-ia create secret generic plataforma-segredos \
#     --from-literal=JWT_SEGREDO=... --from-literal=GATEWAY_USUARIO=... \
#     --from-literal=GATEWAY_SENHA=...
apiVersion: v1
kind: Secret
metadata:
  name: plataforma-segredos
type: Opaque
stringData:
  JWT_SEGREDO: troque-este-segredo
  GATEWAY_USUARIO: admin
  GATEWAY_SENHA: troque-esta-senha
