# configuracao que nao e segredo (a mesma do .env.example). os servicos se
# acham pelo NOME do Service (redis, inferencia, vetorial): descoberta de
# servicos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plataforma-config
data:
  REDIS_URL: redis://redis:6379/0
  REDIS_TIMEOUT: "1"
  REDIS_TENTATIVAS: "1"
  RESULTADO_TTL_SEGUNDOS: "86400"
  DESCARTE_MAXIMO: "1000"
  URL_INFERENCIA: http://inferencia:8001
  URL_VETORIAL: http://vetorial:8002
  JWT_EXPIRA_MINUTOS: "30"
  LIMITE_POR_MINUTO: "10"
  LIMITE_LOGIN_POR_MINUTO: "5"
  LIMITE_REDIS_TIMEOUT: "0.5"
  INFERENCIA_TIMEOUT_CONEXAO: "1"
  INFERENCIA_TIMEOUT_LEITURA: "3"
  INFERENCIA_TENTATIVAS: "3"
  INFERENCIA_ESPERA_BASE: "0.2"
  VETORIAL_TIMEOUT_CONEXAO: "1"
  VETORIAL_TIMEOUT_LEITURA: "3"
  VETORIAL_TENTATIVAS: "3"
  VETORIAL_ESPERA_BASE: "0.2"
  DISJUNTOR_LIMITE_FALHAS: "3"
  DISJUNTOR_ESPERA_SEGUNDOS: "15"
  WORKER_ESPERA_REDIS_BASE: "1"
  WORKER_ESPERA_REDIS_MAXIMA: "30"
  WORKER_MAX_TENTATIVAS: "3"
